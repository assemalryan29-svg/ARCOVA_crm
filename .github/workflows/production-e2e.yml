name: ARCOVA Production E2E

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Probe production health
        shell: bash
        run: |
          for i in {1..9}; do
            if curl -fsS --max-time 10 https://arcova-crm.vercel.app/api/health >/tmp/health.json; then
              cat /tmp/health.json
              break
            fi
            sleep 10
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright test runner
        run: npm install --no-save --no-audit --no-fund @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production browser smoke tests
        env:
          E2E_BASE_URL: https://arcova-crm.vercel.app
        run: npx playwright test --config=playwright.production.config.mjs
